{extend name="admin@layout/layout" /}

{block name="content"}
{include file="admin@layout/breadcrumb" close="show" /}
<div class="layui-fluid layui-content">
    <div class="layui-card">
        <div class="layui-card-header">{$currentMenu.name}</div>
        <div class="layui-card-body">
            <form class="layui-form">
                <div class="layui-form-item">
                    <label class="layui-form-label layui-required">所属角色</label>
                    <div class="layui-input-block">
                        <div id="role"></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label layui-required">头像</label>
                    <div class="layui-input-block">
                        <div id="avatar"></div>
                        <input type="hidden" name="avatar" class="layui-builder-image" lay-verify="required" lay-reqText="请上传头像" value="{$manager.avatar}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label layui-required">姓名</label>
                    <div class="layui-input-block">
                        <input type="text" name="real_name" lay-verify="required" placeholder="请输入姓名" class="layui-input" value="{$manager.real_name}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label layui-required">账号</label>
                    <div class="layui-input-block">
                        <input type="text" name="account" lay-verify="required" placeholder="请输入账号" class="layui-input layui-disabled" disabled value="{$manager.account}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">密码</label>
                    <div class="layui-input-block">
                        <input type="text" name="password" placeholder="如无需修改请留空" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label layui-required">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="启用" {eq name="$manager.status" value="1"}checked{/eq}>
                        <input type="radio" name="status" value="2" title="禁用" {eq name="$manager.status" value="2"}checked{/eq}>
                        <input type="radio" name="status" value="3" title="锁定" {eq name="$manager.status" value="3"}checked{/eq}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="submit" class="layui-btn" lay-submit="">提交</button>
                        <button type="button" class="layui-btn layui-btn-danger easy-close-layer">关闭</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{/block}

{block name="js"}
<script>

    layui.use(['easyModule'], function () {

        var form = layui.form;
        var easyAdmin = layui.easyAdmin;
        var easyCreate = layui.easyCreate;
        var easyService = layui.easyService;

        /**
         * 设置上传路径
         */
        easyCreate.getUploader('avatar', function (uploader) {
            uploader.config.url = "{:url('admin/Manager/avatar')}";
        });

        easyService.roleSingleSelect({
            elem: '#role',
            selected: '{$manager.role_id}',
            setting: {
                name: 'role_id',
                layVerify: 'required'
            }
        });

        form.on('submit', function (obj) {
            event.preventDefault();

            obj.field.id = '{$manager.id}';

            easyAdmin.http({
                type: "POST",
                url: "{:url('admin/Manager/update')}",
                data: obj.field,
                success: function (result) {
                    var key = top.layer.alert(result.msg, {
                        icon: 1,
                    }, function () {
                        parent.layui.table.reloadData("table");
                        top.layer.close(key);
                        easyAdmin.closeLayer();
                    });
                }
            });
        });
    });
</script>
{/block}
