{extend name="admin@layout/layout" /}

{block name="content"}
{include file="admin@layout/breadcrumb" /}
<div class="layui-fluid layui-content">
    <div class="layui-card">
        <div class="layui-card-header">{$currentMenu.name}</div>
        <div class="layui-card-body">
            <form class="layui-form">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">角色名称</label>
                        <div class="layui-input-inline">
                            <input type="text" name="title" class="layui-input" placeholder="请输入角色名称">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button type="reset" class="layui-btn layui-btn-danger" lay-submit="" lay-filter="reset">
                            <i class="fa fa-fw fa-refresh"></i>重置
                        </button>
                        <button type="submit" class="layui-btn" lay-submit="" lay-filter="search">
                            <i class="fa fa-fw fa-search"></i>搜索
                        </button>
                    </div>
                </div>
            </form>
            <table class="layui-hide" id="table" lay-filter="table"></table>
        </div>
    </div>
</div>

<script type="text/html" id="toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-default" lay-event="create">
            <i class="fa fa-fw fa-plus"></i>角色添加
        </button>
    </div>
</script>

<script type="text/html" id="bar">
    <button class="layui-btn layui-btn-sm" lay-event="update">
        <i class="fa fa-fw fa-edit"></i>修改
    </button>
    <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="delete">
        <i class="fa fa-fw fa-trash"></i>删除
    </button>
</script>

<script type="text/html" id="is_system">
    {{#  if(d.is_system == 1){ }}<span class="layui-badge layui-bg-green">是</span>{{#  } }}
    {{#  if(d.is_system == 2){ }}<span class="layui-badge layui-bg-orange">否</span>{{#  } }}
</script>
{/block}

{block name="js"}
<script type="text/javascript">
    layui.use(['easyModule', 'form', 'table'], function () {
        var form = layui.form;
        var table = layui.table;
        var easyAdmin = layui.easyAdmin;

        table.render({
            id: "table",
            elem: '#table',
            url: "{:url('admin/Role/index')}",
            toolbar: '#toolbar',
            cols: [[
                {type: 'checkbox'},
                {field: 'id', title: 'ID', width: 80},
                {field: 'name', title: '角色名称', width: 240},
                {field: 'identify', title: '角色标识', width: 160},
                {field: 'remark', title: '备注'},
                {field: 'is_system', title: '系统内置', width: 140, templet: "#is_system"},
                {title: '操作', toolbar: '#bar', width: 180}
            ]]
        });

        table.on('toolbar(table)', function (obj) {
            if(obj.event === 'create') {
                easyAdmin.openLayer("{:url('admin/Role/create')}");
            }
        });

        table.on('tool(table)', function (obj) {

            if(obj.event === "update") {
                easyAdmin.openLayer("{:url('admin/Role/update')}?id=" + obj.data.id);
            }

            if(obj.event === "delete") {
                top.layer.confirm('确定删除吗？', {
                    icon: 3,
                }, function () {
                    easyAdmin.http({
                        type: "POST",
                        url: "{:url('admin/Role/delete')}",
                        data: {
                            id: obj.data.id
                        },
                        success: function (result) {
                            var key = top.layer.alert(result.msg, {
                                icon: 1,
                            }, function () {
                                layui.table.reload("table");
                                top.layer.close(key);
                            });
                        }
                    });
                });
            }
        });

        form.on("submit(search)", function (obj) {
            event.preventDefault();
            table.reload("table", {
                where: obj.field,
                page: {
                    curr: 1
                },
            });
        });

        form.on("submit(reset)", function (obj) {
            table.reload("table", {
                where: {},
                page: {
                    curr: 1
                },
            });
        });
    });
</script>
{/block}
