{extend name="admin@layout/layout" /}

{block name="content"}
{include file="admin@layout/breadcrumb" /}
<div class="layui-fluid layui-content">
    <div class="layui-card">
        <div class="layui-card-header">{$currentMenu.name}</div>
        <div class="layui-card-body">
            <form class="layui-form">
                <div class="layui-form-item">
                    <label class="layui-form-label layui-required">测试文本</label>
                    <div class="layui-input-block">
                        <textarea name="content" lay-verify="required" placeholder="请填写测试文本" class="layui-textarea">{$setting.content}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="submit" class="layui-btn" lay-submit="">保存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{/block}

{block name="js"}
<script>

    layui.use(['easyModule', 'form'], function () {

        var form = layui.form;
        var easyAdmin = layui.easyAdmin;

        form.on('submit', function (obj) {
            event.preventDefault();

            easyAdmin.http({
                type: "POST",
                url: "{:url('admin/SystemSetting/config')}",
                data: obj.field,
                success: function (result) {
                    var key = top.layer.alert(result.msg, {
                        icon: 1,
                    }, function () {
                        top.layer.close(key);
                    });
                }
            });
        });
    });
</script>
{/block}
