<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>跳转提示</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased
        }

        a {
            outline: 0;
            color: #3498db;
            text-decoration: none;
            cursor: pointer
        }

        .easy-message {
            padding: 100px 100px 100px;
            background: #fff;
            text-align: center;
            height: 100vh;
        }

        .easy-message h1 {
            margin: 0 0 14px;
            font-weight: normal;
            font-size: 40px;
            color: #444;
        }

        .easy-message .jump, .easy-message .image {
            margin: 20px 0;
            padding: 10px 0;
        }

        .easy-message .jump {
            font-size: 14px;
        }

        .easy-message .jump a {
            color: #333;
        }

        .easy-message p {
            font-size: 14px;
            line-height: 20px;
        }

        .easy-message .btn {
            display: inline-block;
            margin: 0 10px;
            width: 138px;
            height: 32px;
            border: 1px solid #44a0e8;
            border-radius: 30px;
            color: #44a0e8;
            text-align: center;
            font-size: 16px;
            line-height: 30px;
        }

        .easy-success .btn {
            border-color: #2d8cf0;
            color: #2d8cf0
        }

        .easy-error .btn {
            border-color: #ed4014;
            color: #ed4014
        }

        .easy-tips p {
            width: 100%;
            color: #919191;
            text-align: center;
            font-size: 14px;
            margin-top: 50px;
        }

        .easy-message .btn-grey {
            border-color: #bbb;
            color: #bbb
        }

        .clearfix:after {
            clear: both;
            display: table;
            content: ""
        }
    </style>
</head>

<script src="{:register_static('/admin/plugin/layui/layui.js')}"></script>
<script type="text/javascript">
    layui.use(['jquery'], function () {

        var $ = layui.$;
        var wait = $("#wait").text();
        var redirect = $("#redirect").attr("href");
        var index = parent.layer.getFrameIndex(window.name);

        setInterval(function () {
            wait--;
            if (wait <= 0) {
                if (index) {
                    parent.layer.close(index);
                } else {
                    location.href = redirect;
                }
            }
            $("#wait").text(wait);
        }, 1000);

        $("#close").click(function () {
            if (index) {
                parent.layer.close(index);
            } else {
                window.history.back();
            }
        });
    });
</script>
